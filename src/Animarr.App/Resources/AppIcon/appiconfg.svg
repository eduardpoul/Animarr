<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Animarr app icon — foreground. Lowercase "a" brand mark on a teal
     gradient tile, matching the Welcome / Setup brand-mark chip. MAUI
     applies the safe-zone scaling around this layer for adaptive icons
     (Android round / squircle / Windows tile). Keep glyph inside the
     centre ~60% so launchers' aggressive crops don't clip the letterform. -->
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <!-- Soft teal accent (Quietude default) → brighter top-right -->
            <stop offset="0%"  stop-color="#5a9fb0"/>
            <stop offset="100%" stop-color="#7cc1d2"/>
        </linearGradient>
        <!-- Subtle inner highlight to give the tile depth at small sizes -->
        <radialGradient id="h" cx="0.3" cy="0.25" r="0.7">
            <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- Rounded tile that fills ~78% of the safe zone (456 * 0.78 ≈ 356) -->
    <g transform="translate(50 50)">
        <rect width="356" height="356" rx="80" ry="80" fill="url(#g)"/>
        <rect width="356" height="356" rx="80" ry="80" fill="url(#h)"/>

        <!-- Lowercase "a" — heavy weight, geometric. Centered on the tile. -->
        <text x="178" y="245"
              font-family="-apple-system, 'Segoe UI', 'Inter', system-ui, sans-serif"
              font-size="240"
              font-weight="800"
              text-anchor="middle"
              fill="#ffffff"
              letter-spacing="-6">a</text>
    </g>
</svg>
