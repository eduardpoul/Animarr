<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Animarr splash — path-only mark. The previous version used <text> for
     the "a" glyph but MAUI's Android splash generator can't always render
     text reliably (depends on which font shipped with the device's system
     image), so on some phones the splash collapsed to just the background
     colour. Rewriting as a flat path-based shape guarantees the brand mark
     paints regardless of OS font availability. -->
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"  stop-color="#5a9fb0"/>
            <stop offset="100%" stop-color="#7cc1d2"/>
        </linearGradient>
    </defs>
    <!-- Rounded teal tile, centred in 456×456 with a 50px gutter on each side. -->
    <rect x="50" y="50" width="356" height="356" rx="80" ry="80" fill="url(#g)"/>
    <!-- "a" mark as a path — hand-built lowercase glyph that reads at any
         splash size. Two filled shapes: the bowl (outer arc with a counter)
         and the stem (right-side vertical bar). Tuned to match the brand
         tile's optical centre. -->
    <g fill="#ffffff" transform="translate(126 116)">
        <!-- Outer bowl as a rounded near-circle, then the counter (hole)
             punched out via fill-rule:evenodd. -->
        <path fill-rule="evenodd" d="M 110 0
                 C 49 0 0 49 0 110
                 C 0 171 49 220 110 220
                 C 141 220 169 207 188 187
                 L 188 220
                 L 220 220
                 L 220 0
                 L 188 0
                 L 188 33
                 C 169 13 141 0 110 0 Z
                 M 110 56
                 C 80 56 56 80 56 110
                 C 56 140 80 164 110 164
                 C 140 164 164 140 164 110
                 C 164 80 140 56 110 56 Z"/>
    </g>
</svg>
