<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Animarr splash mark — same brand glyph as appiconfg.svg but rendered
     against the splash background colour (set via MauiSplashScreen Color
     in the .csproj). The teal tile + lowercase "a" stay consistent so the
     hand-off from splash → first paint of the Welcome screen feels like
     one continuous brand surface. -->
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"  stop-color="#5a9fb0"/>
            <stop offset="100%" stop-color="#7cc1d2"/>
        </linearGradient>
    </defs>
    <g transform="translate(50 50)">
        <rect width="356" height="356" rx="80" ry="80" fill="url(#g)"/>
        <text x="178" y="245"
              font-family="-apple-system, 'Segoe UI', 'Inter', system-ui, sans-serif"
              font-size="240"
              font-weight="800"
              text-anchor="middle"
              fill="#ffffff"
              letter-spacing="-6">a</text>
    </g>
</svg>
