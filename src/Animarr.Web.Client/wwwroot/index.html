<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animarr</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <!-- Inline @font-face declarations at the top of HEAD so the browser
         discovers them before parsing any other stylesheet, matching what
         the original Razor App.razor did. The .ttf files ship as static
         web assets from Animarr.UI's wwwroot. -->
    <style>
        @@font-face { font-family: 'Geist';         font-weight: 400; font-style: normal; font-display: swap; src: url('_content/Animarr.UI/lib/fonts/geist-400.ttf')         format('truetype'); }
        @@font-face { font-family: 'Geist';         font-weight: 500; font-style: normal; font-display: swap; src: url('_content/Animarr.UI/lib/fonts/geist-500.ttf')         format('truetype'); }
        @@font-face { font-family: 'Geist';         font-weight: 600; font-style: normal; font-display: swap; src: url('_content/Animarr.UI/lib/fonts/geist-600.ttf')         format('truetype'); }
        @@font-face { font-family: 'Geist';         font-weight: 700; font-style: normal; font-display: swap; src: url('_content/Animarr.UI/lib/fonts/geist-700.ttf')         format('truetype'); }
        @@font-face { font-family: 'Geist Mono';    font-weight: 400; font-style: normal; font-display: swap; src: url('_content/Animarr.UI/lib/fonts/geist-mono-400.ttf')    format('truetype'); }
        @@font-face { font-family: 'Geist Mono';    font-weight: 500; font-style: normal; font-display: swap; src: url('_content/Animarr.UI/lib/fonts/geist-mono-500.ttf')    format('truetype'); }
        @@font-face { font-family: 'Archivo Black'; font-weight: 400; font-style: normal; font-display: swap; src: url('_content/Animarr.UI/lib/fonts/archivo-black-400.ttf') format('truetype'); }
    </style>
    <link rel="preload" href="_content/Animarr.UI/lib/fonts/geist-400.ttf"         as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="_content/Animarr.UI/lib/fonts/geist-500.ttf"         as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="_content/Animarr.UI/lib/fonts/geist-600.ttf"         as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="_content/Animarr.UI/lib/fonts/archivo-black-400.ttf" as="font" type="font/ttf" crossorigin />
    <!-- v5 multi-theme CDN fonts.

         Tailwind CLI v4 strips @import url() statements from tokens.css
         during minification, so the Inter / JetBrains Mono / Quicksand /
         Noto Serif SC / Noto Serif JP families never reached the browser
         when we relied on @import alone. The fix is to load them via
         explicit <link rel="stylesheet"> here in <head>, before app.css
         parses var(--font-ui) and friends. Loading every theme's font
         upfront keeps theme swaps FOUT-free at the cost of ~150 KB extra
         on first paint — acceptable since this is a self-hosted app, not
         a bandwidth-sensitive SaaS landing page. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Quicksand:wght@500;600;700&family=Noto+Serif+SC:wght@500;700;900&family=Noto+Serif+JP:wght@500;700&display=swap" />

    <!-- Global design tokens + component classes (Tailwind output baked in
         to Animarr.UI/wwwroot/app.css). -->
    <link rel="stylesheet" href="_content/Animarr.UI/app.css" />
    <!-- Merged scoped-CSS bundle (every RCL's [b-xxx] rules). -->
    <link href="Animarr.Web.Client.styles.css" rel="stylesheet" />
    <!-- Custom HUD overlay for animarr-player.js. Not scoped-CSS because the
         HUD DOM is injected by JS and wouldn't match [b-xxx] selectors. -->
    <link rel="stylesheet" href="_content/Animarr.UI/animarr-player.css" />

    <!-- Artplayer + hls.js. -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5/dist/hls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/artplayer@5/dist/artplayer.js"></script>

    <!-- v5 Phase 7: html5-qrcode for the Login → "Scan QR from TV" modal.
         Loaded on every page so the Pair flow works in either WASM or MAUI. -->
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <script>
        // Accent-hue setter — every oklch(L C var(--accent-hue)) rule reads it.
        window.animarr_setAccentHue = function (hue) {
            if (typeof hue !== 'number') hue = parseInt(hue, 10);
            if (Number.isFinite(hue))
                document.documentElement.style.setProperty('--accent-hue', hue);
        };
        // Personality theme setter (v5). Sets <html data-theme="<slug>"> which
        // cascades into every [data-theme="..."] block in Styles/themes/*.css.
        // Persisted in localStorage so subsequent loads paint instantly,
        // before .NET fetches /api/me/preferences.
        window.animarr_setTheme = function (slug) {
            if (typeof slug !== 'string' || slug.length === 0) slug = 'quietude';
            document.documentElement.setAttribute('data-theme', slug);
            try { localStorage.setItem('animarr-theme', slug); } catch (_) {}
        };
        (function () {
            var storedHue = localStorage.getItem('animarr-accent');
            if (storedHue && /^\d+$/.test(storedHue))
                window.animarr_setAccentHue(parseInt(storedHue, 10));
            var storedTheme = localStorage.getItem('animarr-theme');
            document.documentElement.setAttribute('data-theme', storedTheme || 'quietude');
        })();
    </script>
</head>

<body>
    <!-- Boot splash — v6 mark (sharp geo A + sparkle) paints before
         Blazor mounts. Inlined so it shows up before app.css arrives;
         matches MAUI's wwwroot/index.html splash for a consistent
         hand-off across platforms. -->
    <style>
        #app:has(.animarr-boot) {
            position: fixed; inset: 0;
            background: #0b0d10;
            display: grid; place-items: center;
            z-index: 9999;
        }
        .animarr-boot {
            display: flex; flex-direction: column;
            align-items: center; gap: 18px;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        .animarr-boot__mark {
            width: 84px; height: 84px;
            display: block;
            border-radius: 22px;
            box-shadow: 0 16px 40px -12px oklch(0.62 0.06 200 / 0.35);
        }
        .animarr-boot__ring {
            width: 22px; height: 22px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.10);
            border-top-color: #84c0d2;
            animation: animarr-boot-spin 0.9s linear infinite;
            margin-top: 8px;
        }
        .animarr-boot__label {
            font-family: 'JetBrains Mono', ui-monospace, "SF Mono", monospace;
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(154, 163, 178, 0.7);
        }
        @@keyframes animarr-boot-spin { to { transform: rotate(360deg); } }
    </style>

    <div id="app">
        <div class="animarr-boot">
            <svg class="animarr-boot__mark" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect width="72" height="72" rx="20" fill="#0a0c10"/>
                <path d="M14 58 L32 12 L40 12 L58 58 L48 58 L43 46 L29 46 L24 58 Z M31 39 L41 39 L36 24 Z"
                      fill="#84c0d2"
                      fill-rule="evenodd"/>
                <path d="M58 14 L60 18 L64 19 L60 21 L58 25 L56 21 L52 19 L56 18 Z"
                      fill="#ffffff">
                    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/>
                </path>
            </svg>
            <div class="animarr-boot__ring" aria-hidden="true"></div>
            <div class="animarr-boot__label">Loading library</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Что-то пошло не так.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>

    <script src="_content/Animarr.UI/backdrop.js"></script>
    <script src="_content/Animarr.UI/animarr-calibrate.js"></script>
    <script src="_content/Animarr.UI/animarr-player.js"></script>
    <script src="_content/Animarr.UI/tv-nav.js"></script>
    <script src="_content/Animarr.UI/qr-scan.js"></script>
</body>

</html>
