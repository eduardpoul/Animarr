<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animarr</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="_content/Animarr.UI/Animarr.UI.bundle.scp.css" rel="stylesheet" />
    <link href="Animarr.Web.Client.styles.css" rel="stylesheet" />
    <style>
        html, body { margin: 0; padding: 0; background: #0b0d10; color: #f0f1f3;
                     font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        .loading-screen { display:flex; align-items:center; justify-content:center;
                          min-height:100vh; flex-direction:column; gap:16px; }
        .loading-screen .spinner { width:48px; height:48px; border:4px solid #21262d;
                                    border-top-color: oklch(60% 0.18 25); border-radius:50%;
                                    animation: spin 1s linear infinite; }
        @@keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <!-- Artplayer + hls.js — same CDN setup the server-side Razor uses.
         animarr-player.js (shipped as a static web asset from Animarr.UI)
         consumes both globals via Artplayer's customType.m3u8 hook. -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5/dist/hls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/artplayer@5/dist/artplayer.js"></script>
</head>

<body>
    <div id="app">
        <div class="loading-screen">
            <div class="spinner"></div>
            <div>Loading Animarr…</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Что-то пошло не так.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>

    <!-- Audio-offset calibration (localStorage-backed) + player module. -->
    <script src="_content/Animarr.UI/animarr-calibrate.js"></script>
    <script src="_content/Animarr.UI/animarr-player.js"></script>
</body>

</html>
