<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animarr</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <!-- Animarr.Web.Client.styles.css is the merged scoped-CSS bundle: Blazor
         aggregates every referenced RCL's [b-xxx]-attribute rules into this
         single stylesheet at build time, so we don't link Animarr.UI's bundle
         separately (and the fingerprinted path wouldn't work in a static HTML
         anyway — see the script-tag note below). -->
    <link href="Animarr.Web.Client.styles.css" rel="stylesheet" />
    <style>
        html, body { margin: 0; padding: 0; background: #0b0d10; color: #f0f1f3;
                     font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        .loading-screen { display:flex; align-items:center; justify-content:center;
                          min-height:100vh; flex-direction:column; gap:16px; }
        .loading-screen .spinner { width:48px; height:48px; border:4px solid #21262d;
                                    border-top-color: oklch(60% 0.18 25); border-radius:50%;
                                    animation: spin 1s linear infinite; }
        @@keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <!-- Artplayer + hls.js — same CDN setup the server-side Razor uses.
         animarr-player.js (shipped as a static web asset from Animarr.UI)
         consumes both globals via Artplayer's customType.m3u8 hook. -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5/dist/hls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/artplayer@5/dist/artplayer.js"></script>
</head>

<body>
    <div id="app">
        <div class="loading-screen">
            <div class="spinner"></div>
            <div>Loading Animarr…</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Что-то пошло не так.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- Plain filename: `#[.{fingerprint}]` placeholder gets substituted by
         MapStaticAssets only when Razor renders the page. Our index.html is
         a static file, so the placeholder reaches the browser literally and
         404s. Cache-busting is handled by blazor.boot.json's content hashes. -->
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- Audio-offset calibration (localStorage-backed) + player module. -->
    <script src="_content/Animarr.UI/animarr-calibrate.js"></script>
    <script src="_content/Animarr.UI/animarr-player.js"></script>
</body>

</html>
