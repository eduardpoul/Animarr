<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animarr</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <!-- Self-hosted Geist / Geist Mono / Archivo Black @font-face + preloads
         were removed when the display + mono identity moved to Hanken
         Grotesk. All fonts now load from the Google Fonts CDN below. For
         an offline / air-gapped install, see lib/fonts/fonts.css + README. -->
    <!-- v5 multi-theme CDN fonts.

         Tailwind CLI v4 strips @import url() statements from tokens.css
         during minification, so the Inter / JetBrains Mono / Quicksand /
         Noto Serif SC / Noto Serif JP families never reached the browser
         when we relied on @import alone. The fix is to load them via
         explicit <link rel="stylesheet"> here in <head>, before app.css
         parses var(--font-ui) and friends. Loading every theme's font
         upfront keeps theme swaps FOUT-free at the cost of ~150 KB extra
         on first paint — acceptable since this is a self-hosted app, not
         a bandwidth-sensitive SaaS landing page. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Serif+JP:wght@500;700&display=swap" />

    <!-- Global design tokens + component classes (Tailwind output baked in
         to Animarr.UI/wwwroot/app.css). -->
    <link rel="stylesheet" href="_content/Animarr.UI/app.css" />
    <!-- Merged scoped-CSS bundle (every RCL's [b-xxx] rules). -->
    <link href="Animarr.Web.Client.styles.css" rel="stylesheet" />
    <!-- Custom HUD overlay for animarr-player.js. Not scoped-CSS because the
         HUD DOM is injected by JS and wouldn't match [b-xxx] selectors.
         Plain URL, like every other _content/ asset. This (and the player JS
         at the bottom) used to be a per-load `?v=Date.now()` document.write so
         a deploy could never be pinned stale — but the pinning came from a
         leftover PWA service worker (service-worker.js now removes it), and
         the unique URL re-downloaded AND re-compiled the ~185 KB player on
         every load (a new URL also defeats the browser's compiled-code cache).
         MapStaticAssets serves these no-cache + ETag: each load revalidates
         (a 304 when unchanged), so a deploy still lands on the next load.
         NOT build-time fingerprint placeholders: they are only expanded when
         Animarr.Web.Client itself is built/published — the hosted
         `dotnet publish src/Animarr.Web` (the Docker image) ships this file
         raw, so a placeholder URL would 404 in production. -->
    <link rel="stylesheet" href="_content/Animarr.UI/animarr-player.css" />

    <!-- hls.js + Artplayer (player) and html5-qrcode (Login / Pair QR scan)
         are NOT loaded here any more: as parser-blocking <head> scripts from
         the CDN they held the boot splash and the whole WASM boot hostage to
         jsDelivr on every load (and forever on a LAN-only install). They load
         on first use instead — animarr-player.js (attach / preload) and
         qr-scan.js own the pinned, SRI-checked URLs. -->

    <script>
        // Accent-hue setter — every oklch(L C var(--accent-hue)) rule reads it.
        window.animarr_setAccentHue = function (hue) {
            if (typeof hue !== 'number') hue = parseInt(hue, 10);
            if (Number.isFinite(hue))
                document.documentElement.style.setProperty('--accent-hue', hue);
        };
        // Theme setter (Fluent 2): exactly two themes, <html data-theme="dark|light">.
        // Legacy v5 personality slugs (quietude, cinematic, …) still sitting in
        // user preferences / localStorage map to dark, except the paper-white
        // "ink-and-paper" which maps to light. Persisted in localStorage so the
        // next load paints the right theme before /api/me/preferences returns.
        // NavPane collapse state (Fluent nav rail). Mirrored onto <html> so the
        // main column's left offset (--nav-cur) follows without a re-render.
        window.animarr_setNavCollapsed = function (collapsed) {
            document.documentElement.classList.toggle('nav-collapsed', !!collapsed);
            try { localStorage.setItem('animarr-nav-collapsed', collapsed ? '1' : '0'); } catch (_) {}
        };
        try {
            if (localStorage.getItem('animarr-nav-collapsed') === '1')
                document.documentElement.classList.add('nav-collapsed');
        } catch (_) {}
        window.animarr_normTheme = function (slug) {
            return (slug === 'light' || slug === 'ink-and-paper') ? 'light' : 'dark';
        };
        window.animarr_setTheme = function (slug) {
            slug = window.animarr_normTheme(slug);
            document.documentElement.setAttribute('data-theme', slug);
            try { localStorage.setItem('animarr-theme', slug); } catch (_) {}
        };
        (function () {
            var storedHue = localStorage.getItem('animarr-accent');
            if (storedHue && /^\d+$/.test(storedHue))
                window.animarr_setAccentHue(parseInt(storedHue, 10));
            var storedTheme = localStorage.getItem('animarr-theme');
            document.documentElement.setAttribute('data-theme', window.animarr_normTheme(storedTheme));
            // Interface language cached from last session. Program.cs loads this
            // exact pack before the first render, so a non-English user never
            // sees an English flash before /api/me/preferences comes back.
            // <html lang> is updated for a11y / correct hyphenation too.
            try {
                var storedLang = localStorage.getItem('animarr-lang');
                if (storedLang) document.documentElement.setAttribute('lang', storedLang);
            } catch (_) {}
        })();

        // ── TV-mode boot resolver ───────────────────────────────────────
        // Mirrors the heavier resolver in Animarr.App's index.html, but for
        // the pure WASM host (someone opening Animarr in a Tizen/webOS/
        // Bravia browser, or a Chromecast-with-Google-TV Chromium build).
        //
        // Precedence:
        //   1. localStorage.animarr_tv_mode override ("1" = force on, "0" =
        //      force off — written by ProfilePanel → Appearance → TV mode).
        //   2. UA / pointer heuristic: matches Leanback / Google TV /
        //      Android TV / Bravia / Fire TV / Tizen / webOS / NetCast,
        //      and the "no-touch + no-fine-pointer + landscape" combo that
        //      stops every Smart TV browser ever shipped.
        //
        // Result: <html class="tv-mode"> is set on first paint, so
        // tv-nav.js engages immediately and Login.razor's tv-mode JS check
        // returns the real answer (so the redirect-to-/pair fires).
        (function () {
            var stored = null;
            try { stored = localStorage.getItem('animarr_tv_mode'); } catch (_) {}

            var isTv;
            if (stored === '1') {
                isTv = true;
            } else if (stored === '0') {
                isTv = false;
            } else {
                var ua = navigator.userAgent || '';
                var uaLooksTv = /Leanback|Google TV|Android TV|; TV[^a-z]|BRAVIA|AFT[A-Z]|Tizen|Web0S|webOS|NetCast|HbbTV|SmartTV|VIDAA|VIZIO/i.test(ua);
                var noTouch = !('ontouchstart' in window) && (navigator.maxTouchPoints || 0) === 0;
                var noFinePointer = window.matchMedia
                    && !window.matchMedia('(pointer: fine)').matches;
                var landscape = window.innerWidth > window.innerHeight;
                isTv = uaLooksTv || (noTouch && noFinePointer && landscape);
            }
            if (isTv) {
                document.documentElement.classList.add('tv-mode');
            }
        })();
    </script>
</head>

<body>
    <!-- Boot splash — v6 mark (sharp geo A + sparkle) paints before
         Blazor mounts. Inlined so it shows up before app.css arrives;
         matches MAUI's wwwroot/index.html splash for a consistent
         hand-off across platforms. -->
    <style>
        #app:has(.animarr-boot) {
            position: fixed; inset: 0;
            background: #0b0d10;
            display: grid; place-items: center;
            z-index: 9999;
        }
        /* Brand orange (the default accent, hue 50) — fixed, like the
           native splash and the app icon, whatever accent the user picked. */
        .animarr-boot {
            --boot-accent: oklch(0.75 0.14 50);
            display: flex; flex-direction: column;
            align-items: center; gap: 24px;
            font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
        }
        .animarr-boot__mark {
            width: 88px; height: 88px;
            display: block;
            border-radius: 24px;
            color: var(--boot-accent);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06),
                        0 18px 48px -12px oklch(0.70 0.16 50 / 0.5);
            animation: animarr-boot-breathe 2.4s ease-in-out infinite;
        }
        /* Fluent indeterminate progress bar. */
        .animarr-boot__bar {
            position: relative;
            width: 136px; height: 3px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }
        .animarr-boot__bar::after {
            content: "";
            position: absolute; inset: 0 auto 0 0;
            width: 40%;
            border-radius: inherit;
            background: var(--boot-accent);
            animation: animarr-boot-slide 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }
        .animarr-boot__label {
            font-size: 13px;
            line-height: 18px;
            color: rgba(255, 255, 255, 0.55);
        }
        @keyframes animarr-boot-slide {
            from { transform: translateX(-100%); }
            to   { transform: translateX(250%); }
        }
        @keyframes animarr-boot-breathe {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.03); }
        }
        @media (prefers-reduced-motion: reduce) {
            .animarr-boot__mark, .animarr-boot__bar::after { animation: none; }
            .animarr-boot__bar::after { width: 100%; opacity: 0.6; }
        }
    </style>

    <div id="app">
        <div class="animarr-boot">
            <svg class="animarr-boot__mark" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect width="72" height="72" rx="20" fill="#0a0c10"/>
                <path d="M14 58 L32 12 L40 12 L58 58 L48 58 L43 46 L29 46 L24 58 Z M31 39 L41 39 L36 24 Z"
                      fill="currentColor"
                      fill-rule="evenodd"/>
                <path d="M58 14 L60 18 L64 19 L60 21 L58 25 L56 21 L52 19 L56 18 Z"
                      fill="#ffffff">
                    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/>
                </path>
            </svg>
            <div class="animarr-boot__bar" role="progressbar" aria-label="Loading"></div>
            <div class="animarr-boot__label">Loading library…</div>
        </div>
        <script>
            // Label in the interface language — the pack isn't loaded yet.
            (function () {
                var lang = '';
                try { lang = localStorage.getItem('animarr-lang') || ''; } catch (_) { }
                lang = (lang || navigator.language || 'en').slice(0, 2).toLowerCase();
                // Same strings as the pack's catalog.loading, shown next by Home.
                var text = { ru: 'Загружаем библиотеку…', uk: 'Завантаження бібліотеки…',
                             de: 'Bibliothek wird geladen…', es: 'Cargando biblioteca…' }[lang];
                var el = document.querySelector('.animarr-boot__label');
                if (text && el) el.textContent = text;
            })();
        </script>
    </div>

    <div id="blazor-error-ui">
        Что-то пошло не так.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>

    <script src="_content/Animarr.UI/backdrop.js"></script>
    <script src="_content/Animarr.UI/animarr-calibrate.js"></script>
    <!-- Plain, revalidated URL — see the animarr-player.css note in <head>. -->
    <script src="_content/Animarr.UI/animarr-player.js"></script>
    <script src="_content/Animarr.UI/tv-nav.js"></script>
    <script src="_content/Animarr.UI/app-shell.js"></script>
    <script src="_content/Animarr.UI/qr-scan.js"></script>
</body>

</html>
